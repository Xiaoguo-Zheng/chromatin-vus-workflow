[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatin-vus-workflow"
version = "0.1.0"
description = "Traceable annotation and experimental follow-up planning for human chromatin-regulator variants"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ui = ["streamlit>=1.40,<2"]

[project.scripts]
chromatin-vus = "chromatin_vus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chromatin_vus = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
